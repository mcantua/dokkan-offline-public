name: AppInstallerCloudSmoke
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGNING_REQUIRED: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: '16.4'
    TARGETED_DEVICE_FAMILY: '1'
    ONLY_ACTIVE_ARCH: YES
    ARCHS: __ARCH__
    OTHER_LDFLAGS: ['-lz', '-liconv']
targets:
  AppInstaller:
    type: application
    platform: iOS
    sources:
      - path: ../../ios
        excludes: ['Info.plist', 'assets']
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tin.appinstaller.cloudsmoke
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: AppInstaller
        HEADER_SEARCH_PATHS: '$(SRCROOT)/../../ios'
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../core/target/__RUST_TARGET__/release']
    dependencies:
      # XcodeGen uses framework file references for prebuilt archives too. Never embed the static .a.
      - framework: ../../core/target/__RUST_TARGET__/release/libapp_installer_core.a
        embed: false
        link: true
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      - sdk: Foundation.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
  AppInstallerCloudUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tin.appinstaller.cloudsmoke.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: '$(SRCROOT)/../../ios'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/AppInstaller.app/AppInstaller'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: AppInstaller
      - sdk: XCTest.framework
schemes:
  AppInstallerCloudSmoke:
    build:
      targets:
        AppInstaller: all
        AppInstallerCloudUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - AppInstallerCloudUITests
