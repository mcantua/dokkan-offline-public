name: Promote pinned candidate and source in existing private draft
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: app-installer-current-candidate-draft-assets
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI-Workspace/claude-chatg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: AI-Workspace/claude-chatg
      - name: Verify actual new distribution and promote seven assets while preserving owned fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 app-installer/cloud-ui/promote-draft-candidate.py
      - name: Keep the promotion receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-installer-candidate-promotion-receipt
          path: AI-Workspace/claude-chatg/app-installer/cloud-ui/work/candidate-promotion-report.json
          if-no-files-found: error
          retention-days: 7
