name: Deliver reviewed App Installer public draft
on:
  workflow_dispatch:
    inputs:
      contract:
        description: Repository-relative contract pinned after reviewing actual successful public build artifacts
        required: true
        type: string
        default: app-installer/cloud-ui/public-delivery-contract.json
permissions:
  contents: write
  actions: read
concurrency:
  group: app-installer-public-review-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'mcantua/dokkan-offline-public' && github.ref == 'refs/heads/chatgpt/app-installer-pairing-repair'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AI-Workspace/dokkan-offline-public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: AI-Workspace/dokkan-offline-public
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify reviewed public source and seven assets, then stage the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_CONTRACT: ${{ inputs.contract }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 app-installer/cloud-ui/public-delivery.py --contract "$DELIVERY_CONTRACT" --execute
      - name: Retain the actual seven-asset delivery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-installer-public-delivery-receipt
          path: AI-Workspace/dokkan-offline-public/app-installer/cloud-ui/work/public-delivery-receipt.json
          if-no-files-found: error
          retention-days: 7
