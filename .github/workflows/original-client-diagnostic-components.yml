name: Original-client Duo diagnostic authored components

# Tin's latest standing instruction authorizes ongoing Duo builds. Keep the
# exact reviewed-source gate and manual dispatch; no push/PR/schedule builds.
on:
  workflow_dispatch:
    inputs:
      approved_source_commit:
        description: 'Full reviewed 40-character commit, identical to the selected workflow ref SHA'
        required: true
        type: string
  workflow_call:
    inputs:
      approved_source_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require manual entry and the exact reviewed source
        env:
          APPROVED_SOURCE_COMMIT: ${{ inputs.approved_source_commit }}
        run: |
          python3 - <<'PY'
          import os,re
          if os.environ.get('GITHUB_REPOSITORY')!='mcantua/dokkan-offline-public':
              raise SystemExit('This manual recipe belongs only to the active public source repository.')
          if os.environ.get('GITHUB_EVENT_NAME')!='workflow_dispatch':
              raise SystemExit('This standing-authorized Duo recipe must have a manual workflow entry.')
          approved=os.environ.get('APPROVED_SOURCE_COMMIT','')
          if not re.fullmatch(r'[0-9a-f]{40}',approved) or approved!=os.environ.get('GITHUB_SHA'):
              raise SystemExit('The selected ref must identify exactly the reviewed source commit.')
          print('Manual authored-component build request admitted; no original game data, package or device execution.')
          PY

  components:
    needs: authorize
    # Official GitHub-hosted label verified against actions/runner-images
    # commit 9329c776c4a38d3dcb31fc78b8180005041c07fb, not an unknown
    # self-hosted label. See loader/authored-component-runner-reference.json.
    # Runtime tool checks supplement that source evidence, not Mac permission.
    runs-on: xcode-27
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact clean source and genuine device SDK before compilation
        env:
          APPROVED_SOURCE_COMMIT: ${{ inputs.approved_source_commit }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          python3 - <<'PY'
          import os,subprocess
          def command(*args):
              return subprocess.check_output(args,text=True).strip()
          if command('git','rev-parse','HEAD')!=os.environ['APPROVED_SOURCE_COMMIT']:
              raise SystemExit('The checkout is not the reviewed commit.')
          if command('git','status','--porcelain','--untracked-files=all'):
              raise SystemExit('A clean source checkout is required before compiling components.')
          if not command('xcodebuild','-version').startswith('Xcode 27.1\n'):
              raise SystemExit('Actual Xcode27.1 is required; no SDK metadata substitution.')
          if command('xcrun','--sdk','iphoneos','--show-sdk-version')!='27.1':
              raise SystemExit('Actual iPhoneOS27.1 device SDK is unavailable.')
          print('Exact clean source and genuine Xcode/device SDK admitted; no simulator or Apple account is used.')
          PY
      - name: Compile only the authored diagnostic library once
        run: bash offline-dokkan/original-client/build-components.sh --original-startup-diagnostic-entry
      - name: Admit only this diagnostic library and its exact source receipt
        env:
          APPROVED_SOURCE_COMMIT: ${{ inputs.approved_source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('offline-dokkan/private/component-build')
          library=root/'OfflineDokkanHost.dylib'
          receipt=root/'evidence/component-build.json'
          if library.is_symlink() or receipt.is_symlink() or not library.is_file() or not receipt.is_file():
              raise SystemExit('Only regular authored library/receipt files can be retained.')
          if not 0<library.stat().st_size<=128*1024*1024 or not 0<receipt.stat().st_size<=2*1024*1024:
              raise SystemExit('Unexpected authored component output size.')
          info=json.loads(receipt.read_bytes())
          required={'source_commit':os.environ['APPROVED_SOURCE_COMMIT'],'device_sdk':'27.1',
              'architecture':'arm64','deployment_target':'16.4',
              'original_startup_entry_enabled':False,'original_startup_diagnostic_entry_enabled':True,
              'original_game_launch_verified':False}
          for key,value in required.items():
              if type(info.get(key)) is not type(value) or info.get(key)!=value:
                  raise SystemExit('Component receipt does not identify this authorized diagnostic build.')
          if (info.get('dylib_bytes')!=library.stat().st_size or
                  info.get('dylib_sha256')!=hashlib.sha256(library.read_bytes()).hexdigest()):
              raise SystemExit('Authored library bytes do not match their source receipt.')
          print('Two authored-only outputs admitted. No original game launch or playable build is claimed.')
          PY
      - name: Retain only the authored diagnostic library and source receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-client-duo-diagnostic-components-latest
          path: |
            offline-dokkan/private/component-build/OfflineDokkanHost.dylib
            offline-dokkan/private/component-build/evidence/component-build.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
