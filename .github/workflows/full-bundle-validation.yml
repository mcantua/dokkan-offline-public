name: Full bundle validation gate
on:
  push:
    branches: ['cursor/full-bundle-validation-3bda']
    paths:
      - '.github/workflows/full-bundle-validation.yml'
      - 'offline-dokkan/core/od_core.c'
      - 'offline-dokkan/core/od_core.h'
      - 'offline-dokkan/original-client/creator-bundle/**'
      - 'offline-dokkan/original-client/creator-tools/ODScopedCreatorTools.m'
permissions:
  contents: read
concurrency:
  group: full-bundle-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AI-Workspace/claude-chatg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: AI-Workspace/claude-chatg
      - name: Confirm genuine Xcode 27.1
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.1
      - name: Compile the validation gate with the authored Duo components
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          mkdir -p offline-dokkan/private/component-build-log
          set -o pipefail
          bash offline-dokkan/original-client/build-components.sh 2>&1 | tee offline-dokkan/private/component-build-log/compile.log
      - name: Retain compiler evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-bundle-validation-compile
          path: |
            AI-Workspace/claude-chatg/offline-dokkan/private/component-build/evidence/*.json
            AI-Workspace/claude-chatg/offline-dokkan/private/component-build-log/compile.log
          retention-days: 7
          if-no-files-found: warn
