name: App Installer hosted UIKit trait API inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'mcantua/dokkan-offline-public' && github.ref == 'refs/heads/chatgpt/app-installer-pairing-repair'
    runs-on: xcode-27
    timeout-minutes: 8
    defaults:
      run:
        working-directory: AI-Workspace/dokkan-offline-public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: AI-Workspace/dokkan-offline-public
      - name: Inspect installed public declarations and syntax-check one probe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 app-installer/cloud-ui/inspect-trait-api.py
      - name: Preserve compact declarations and actual compiler result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-installer-trait-api-inventory
          path: AI-Workspace/dokkan-offline-public/app-installer/cloud-ui/work/trait-api-inventory/
          retention-days: 7
          if-no-files-found: error
